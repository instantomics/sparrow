[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iomix-sparrow-segmentation-candidate"
version = "0.1.0"
description = "SPArrOW image segmentation and reference-derived marker annotation for Iomix"
requires-python = ">=3.13,<3.14"
dependencies = [
  "affine==2.4.0",
  "anndata==0.12.19",
  "cellpose @ https://github.com/instantomics/sparrow/releases/download/cellpose-3.1.1.3.post1/cellpose-3.1.1.3.post1-py3-none-any.whl",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pandas==2.3.3",
  "rasterio==1.4.3",
  "scipy==1.16.2",
  "shapely==2.1.2",
  "torch==2.8.0",
]

[project.optional-dependencies]
cpu = []
cu128 = []
cu130 = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mymodel = ["cytotorch_0", "sparrow_native/*.txt"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
