[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-reference-tests"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "affine==2.4.0",
  "numpy==2.2.6",
  "pytest==9.0.2",
  "rasterio==1.4.3",
  "ruff==0.13.2",
  "shapely==2.1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
